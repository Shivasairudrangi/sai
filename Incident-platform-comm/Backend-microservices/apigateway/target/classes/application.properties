# Server configuration
server.port=8075
spring.application.name=api-gateway

# JWT Configuration
app.jwt.secret=9a4f2c8d3b7a1e6f5d4c2b8a6e3f1d7c5b9a2e4f6c8d7a3b5e9f1c8a4d6b2e7f3
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000

# Service URLs
app.service.user=http://localhost:8081
app.service.incident=http://localhost:8082
app.service.chat=http://localhost:8083
app.service.file=http://localhost:8084
app.service.notification=http://localhost:8085

# Rate Limiting Configuration
spring.cloud.gateway.default-filters[0]=RequestRateLimiter=100, 1, 60s
spring.cloud.gateway.filter.request-rate-limiter.deny-empty-key=false
spring.cloud.gateway.filter.request-rate-limiter.key-resolver=#{@ipKeyResolver}

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.incidentcomm=DEBUG

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.gateway.enabled=true

# CORS configuration
spring.webflux.cors.allowed-origins=http://localhost:3000
spring.webflux.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.webflux.cors.allowed-headers=Authorization,Content-Type,X-Requested-With,Accept,Origin,Access-Control-Request-Method,Access-Control-Request-Headers,X-Debug-Token
spring.webflux.cors.exposed-headers=Access-Control-Allow-Origin,Access-Control-Allow-Credentials,Authorization
spring.webflux.cors.allow-credentials=true 