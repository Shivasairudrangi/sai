# Server configuration
server.port=8085
spring.application.name=notification-service

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/incident_comm_notifications?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT Configuration
app.jwt.secret=9a4f2c8d3b7a1e6f5d4c2b8a6e3f1d7c5b9a2e4f6c8d7a3b5e9f1c8a4d6b2e7f3
app.jwt.expiration-ms=86400000

# Service URLs
app.service.user=http://localhost:8081
app.service.incident=http://localhost:8082
app.service.chat=http://localhost:8083
app.service.file=http://localhost:8084

# WebSocket configuration
spring.websocket.path=/ws-notification

# Email configuration (using SMTP)
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=notifications@example.com
spring.mail.password=your-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Disable mail health check
management.health.mail.enabled=false

# Notification settings
app.notification.default-preferences=true
app.notification.batch-size=10
app.notification.cleanup-days=30

# Logging
logging.level.org.springframework=INFO
logging.level.com.incidentcomm=DEBUG

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics