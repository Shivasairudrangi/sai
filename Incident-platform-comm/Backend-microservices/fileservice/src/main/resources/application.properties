# Server configuration
server.port=8084
spring.application.name=file-service

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/incident_comm_files?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# File Upload settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# File storage properties
file.upload-dir=./uploads
file.allowed-types=image/jpeg,image/png,image/gif,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/json,application/xml,application/zip,application/x-rar-compressed,application/x-7z-compressed

# JWT Configuration
app.jwt.secret=9a4f2c8d3b7a1e6f5d4c2b8a6e3f1d7c5b9a2e4f6c8d7a3b5e9f1c8a4d6b2e7f3
app.jwt.expiration-ms=86400000

# Service URLs
app.service.user=http://localhost:8081
app.service.incident=http://localhost:8082
app.service.chat=http://localhost:8083

# Logging
logging.level.org.springframework=INFO
logging.level.com.incidentcomm=DEBUG

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics
