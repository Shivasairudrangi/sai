# Server configuration
server.port=8081
spring.application.name=user-service

# Primary Database configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/incident_comm_users?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Fallback to H2 in-memory database if MySQL is not available
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=10

# JPA/Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT Configuration
# Use a longer, more secure key (at least 256 bits)
app.jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e6f5d4c2b8a6e3f1d7c5b9a2e4f6c8d7a3b5e9f1c8a4d6b2e7f3}
# Token expiration in milliseconds (default: 1 hour)
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
# Refresh token expiration in milliseconds (default: 7 days)
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
# Enable token validation logging
logging.level.com.incidentcomm.userservice.security.jwt=DEBUG

# Logging
logging.level.org.springframework=INFO
logging.level.com.incidentcomm=DEBUG

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics