# Server configuration
server.port=8082
spring.application.name=incident-service

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/incident_comm_incidents?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT Configuration
app.jwt.secret=9a4f2c8d3b7a1e6f5d4c2b8a6e3f1d7c5b9a2e4f6c8d7a3b5e9f1c8a4d6b2e7f3

app.jwt.expiration-ms=86400000

# User service URL
app.service.user=http://localhost:8081

# WebSocket configuration
spring.websocket.path=/ws-incident

# Logging
logging.level.org.springframework=INFO
logging.level.com.incidentcomm=DEBUG

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics